version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: yinfu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: yinfu_app
      MYSQL_USER: yinfu_app
      MYSQL_PASSWORD: 7Lk3TPDjRfbcBNrY
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build: .
    container_name: yinfu-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yinfu_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: yinfu_app
      SPRING_DATASOURCE_PASSWORD: 7Lk3TPDjRfbcBNrY
    ports:
      - "8083:8083"
    depends_on:
      - mysql

volumes:
  mysql_data: